name: Release

# 打 tag 触发：git tag v1.0.0 && git push github v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "../dist/vkeyd-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/vkeyd
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vkeyd-*

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # 签名材料从仓库 Secrets 还原；缺失时产出未签名包（仅用于自测）
      - name: restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VKEY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vkey-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/vkey-release.jks"
              echo "storePassword=${{ secrets.VKEY_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.VKEY_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.VKEY_KEY_PASSWORD }}"
            } > android/keystore.properties
            echo "signed=yes" >> "$GITHUB_ENV"
          else
            echo "signed=no" >> "$GITHUB_ENV"
            echo "::warning::未配置签名 Secrets，产出将未签名"
          fi

      - name: build release apk
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/vkey-android.apk
          cd dist && sha256sum vkey-android.apk > SHA256SUMS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/vkey-android.apk

  publish:
    name: publish release
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum vkeyd-* vkey-android.apk > SHA256SUMS
          cat SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "vkey ${{ github.ref_name }}" \
            --generate-notes

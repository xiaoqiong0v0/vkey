# vkeyd 反向代理 —— 与实际 ECS 部署一致（nginx/1.18.0 Ubuntu）。
#
# 落盘位置（Ubuntu/debian 布局）：
#   /etc/nginx/sites-available/<YOUR_DOMAIN>.conf
#   /etc/nginx/sites-enabled/<YOUR_DOMAIN>.conf -> ../sites-available/...
# 不要再放一份到 conf.d/，否则会被加载两次。
#
# 两阶段上线（顺序不能反：443 块要求证书已存在，否则 `nginx -t` 直接失败）：
#   阶段 1：只启用下面「server 80」块，`nginx -t` 后 reload；
#   阶段 2：sudo certbot certonly --webroot -w /var/www/html -d <YOUR_DOMAIN>
#           再启用「server 443」块，`nginx -t` 通过后 reload 生效。
#   续期：sudo certbot renew --dry-run 验证；webroot 复用 /var/www/html。
#
# 关键约定：
# - TLS 由 nginx 终止，vkeyd 只监听 127.0.0.1:3150（8080 已被其它服务占用）。
# - X-Forwarded-For 必须是 `$remote_addr`，不能是 `$proxy_add_x_forwarded_for`：
#   vkeyd 的限流键取 XFF 首项（server/internal/api/api.go clientIP），
#   用 $proxy_add_x_forwarded_for 会保留客户端自带值，客户端换伪造 IP 即可绕过限流。
#   nginx 与 vkeyd 同机、无上游链路，$remote_addr 不可伪造。
# - 设备签名覆盖「原始 RequestURI」，因此 /api/ 路径不得 rewrite、大小写转换或百分号解码改写，
#   否则签名串与 vkeyd 看到的不一致（401）。

# ---- 阶段 1：80 仅保留 ACME 校验，其余 301 到 https ----
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://<YOUR_DOMAIN>$request_uri;
    }
}

# ---- 阶段 2：443 反代 vkeyd ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # vkeyd 自身限制 8 MiB，这里留一点余量。
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

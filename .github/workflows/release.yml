name: Release

# 打 tag 触发：git tag v1.0.0 && git push github v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "../dist/vkeyd-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/vkeyd
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vkeyd-*

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # 签名材料从仓库 Secrets 还原；缺失时产出未签名包（仅用于自测）
      - name: restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VKEY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vkey-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/vkey-release.jks"
              echo "storePassword=${{ secrets.VKEY_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.VKEY_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.VKEY_KEY_PASSWORD }}"
            } > android/keystore.properties
            echo "signed=yes" >> "$GITHUB_ENV"
          else
            echo "signed=no" >> "$GITHUB_ENV"
            echo "::warning::未配置签名 Secrets，产出将未签名"
          fi

      - name: build release apk
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/vkey-android.apk
          cd dist && sha256sum vkey-android.apk > SHA256SUMS.apk

      # 机器可读的更新元数据：服务端按 TTL 拉取本文件即可，无需 GitHub API（无速率限制）
      - name: update metadata
        run: |
          META=$(find android/app/build/outputs/apk/release -name output-metadata.json | head -1)
          VCODE=$(python3 -c "import json,sys;d=json.load(open('$META'));print(d['elements'][0]['versionCode'])")
          VNAME=$(python3 -c "import json,sys;d=json.load(open('$META'));print(d['elements'][0]['versionName'])")
          SIZE=$(stat -c%s dist/vkey-android.apk)
          SHA=$(sha256sum dist/vkey-android.apk | cut -d' ' -f1)
          python3 - "$VCODE" "$VNAME" "$SIZE" "$SHA" <<'PY' > dist/android.json
          import json, sys, time
          vcode, vname, size, sha = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4]
          json.dump({
              "version_code": int(vcode),
              "version_name": vname,
              "sha256": sha,
              "size": size,
              "published_at": int(time.time()),
          }, sys.stdout)
          PY
          echo "--- android.json ---"
          cat dist/android.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/vkey-android.apk
            dist/android.json

  publish:
    name: publish release
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum vkeyd-* vkey-android.apk > SHA256SUMS
          cat SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "vkey ${{ github.ref_name }}" \
            --generate-notes
